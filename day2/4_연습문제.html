<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container{
            width: 900px;
            margin: 30px auto;
            /* background-color: beige; */
        }
        .title {
            width : 850px;
            background-color: rgb(61, 150, 26);
            text-align: center;
            padding: 10px 0px;
            font-size: 30px;
            font-weight: bold;
            color: white;          
        }

        .title2 {
            text-align: center;
            font-size: 20px;
            color: white; 
        }

        .box{
            color : rgb(0, 0, 0);
            width: 860px;
            height: 900px;
            margin: 30px auto;
            text-align: left;
            border : 1px solid rgb(199, 196, 196);
            
            /* line-height: 200px; */
        }

        .radius{
            border-radius: 1%;
        }
        .shadow {
            box-shadow: 1px 1px 7px black;
        }

        table, tr, th, td{
            border : 2px solid black; /* 2픽셀 크기의 검은색 선(solid) */
            border-collapse: collapse ; /* 겹치는 선 하나로 */
            padding: 5px 20px; /* 상하 5px, 좌우20px 여백 */
            text-align: center; /* 가운데 정렬 */
        }
        th{
            background-color: rgb(204, 230, 238);
        }



    </style>



</head>
<body>
    <div id="container">
        <div class="title">자바 수강생 모집</div>
        <div class="title title2">자바에 관심 있는 새내기 여러분을 모집합니다.</div>

    </div>

    <div class="box radius shadow">
        <div> 교내 프로그래밍 동아리에서 신입생을 대상으로 자바 수강생을 모집합니다.</div>
        <div> 학부나 전공에 상관없습니다.</div>
        <div> 평소 방송에 관심있었던 여러 학우들의 지원바랍니다.</div>

    

    <table>
        <tr>
            <th>모집 기간</th>
            <td>2월 5일 ~ 2월 11일</td>
            
        </tr>

        <tr>
            <th>모집 분야</th>
            <td>자바 기초, 자바 심화, 백엔드 입문</td>
            
        </tr>

        <tr>
            <th>지원 방법</th>
            <td>양식 작성 후 이메일 접수 <br>
			지원서 양식은 교내 동아리 홈페이지 공지 게시판에 있습니다.</td>
            
        </tr>

        

    </table>
    </div>
    
</body>
</html>
